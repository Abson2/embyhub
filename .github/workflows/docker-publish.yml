name: Build and publish hardened image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      alias_version:
        description: "补推无 v 前缀版本别名（如 2.6）；留空跳过"
        required: false
        default: ""
      refresh_version:
        description: "把本次构建的最新镜像覆盖到指定版本号（如 2.6），用于不升版本号的补丁发版；留空跳过"
        required: false
        default: ""

permissions:
  contents: write
  packages: write   # 2.6：双注册表发布，GHCR 推送与公开化需要

# 发版链路：push v* tag -> 本 run 内构建并同步推送 Docker Hub + GHCR -> 冒烟
# -> 自动公开两个仓库 -> 匿名拉取自检 -> release job 创建 GitHub Release。
# 即 Release 出现时，两处镜像均已可免登录拉取，无需任何人工同步。
env:
  # 2.6：Docker Hub 两段式地址，与 walkingd/tgto123 同构
  IMAGE_NAME: abson2/embyhub
  # 同一份镜像同步发布到 GitHub Container Registry，供两处免登录拉取
  GHCR_IMAGE: ghcr.io/abson2/embyhub

jobs:
  verify:
    name: 凭证扫描 / 补丁断言 / 语法检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 扫描凭证与个人配置
        run: python tools/check-no-secrets.py .

      - name: 断言加固改动生效
        run: python tools/verify_patches.py .

      - name: 校验 2.0 重构等价性 / 安全加固 / 公告推送乱码修复
        run: python tests/test_refactor_2_0_equivalence.py

      - name: 校验 B1 入库通知公共逻辑抽离等价性
        run: python tests/test_b1_library_common_equivalence.py

      - name: 校验 B3 / B4 / S5 等价性与特征契约
        run: python tests/test_b_batch_equivalence.py

      - name: 校验 2.0 系统安全契约（CSRF / 鉴权 / CSP / SSRF / 路径穿越 / 净化）
        run: python tools/check_security_contracts.py .

      - name: 校验富文本净化（公告内容不二次转义 / 危险内容剥离）
        run: python tests/test_sanitize_rich_html.py

      - name: 校验 10307/10308 会话 Cookie 隔离
        run: python tools/check_session_cookie_isolation.py .

      - name: 校验求片同步插件（推送 + 删单联动回归）
        run: python tests/test_tg_whitelist_sync.py

      - name: 校验系统级 Bark 推送与 Webhook token 兼容
        run: python tests/test_bark_push.py

      - name: 校验推送场景总控 Bark 渠道前后端字段契约（1.9.5）
        run: python tools/check_bark_channel_contract.py .

      - name: 校验 Emby Webhook 事件映射与入库拆条（1.9.8）
        run: python tests/test_webhook_events.py

      - name: 校验用户端口「通知设置」（需求 5，用户级推送）
        run: python tests/test_user_notify.py

      - name: 校验入库事件订阅（仅启用 Bark 时也触发）
        run: python tools/check_notification_bot_subscription.py .

      - name: 校验三条净化通道 golden 与属性（梯队 0）
        run: python tests/test_sanitizer_properties.py

      - name: 校验 2.1 循环内正则预编译等价性（golden + AST）
        run: python tests/test_loop_regex_equivalence.py

      - name: 校验 2.3 插件导入 / GitHub 发布窗口 / OpenAPI
        run: python tests/test_plugin_import.py

      - name: 架构指标报告与不恶化门槛
        run: python tools/architecture_report.py .

      - name: 热点基准与确定性性能契约
        run: python tools/bench_hotpaths.py .

      - name: 全量纯标准库校验网（自动发现，新增脚本默认纳入）
        run: python tools/run_all_checks.py .

      - name: 编译全部应用源码
        run: python -m compileall -q app/

      - name: 校验 compose 与 workflow 可被解析
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import yaml
          for p in ("docker-compose.yml", ".github/workflows/docker-publish.yml"):
              with open(p, encoding="utf-8") as f:
                  d = yaml.safe_load(f)
              assert isinstance(d, dict), p
              print("yaml ok:", p)
          c = yaml.safe_load(open("docker-compose.yml", encoding="utf-8"))
          imgs = [s.get("image", "") for s in c["services"].values()]
          assert any(i.startswith("abson2/embyhub") for i in imgs), "compose 必须引用自己的镜像"
          print("compose image ok")
          PY

  build:
    name: 构建 / 冒烟 / 推送镜像
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算无 v 前缀版本号
        id: ver
        # v2.6 这类两段式版本号不满足 semver，type=semver 会静默不产出 tag，
        # 而 compose 默认拉取 abson2/embyhub:2.6，因此显式补一条 raw 规则。
        run: |
          echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 一行一个注册表，metadata-action 会为每个 image 生成整套 tags
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=raw,value=${{ steps.ver.outputs.value }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 容器冒烟：默认拒绝鉴权 / 服务可用
        run: |
          set -e
          docker run -d --name ep-smoke -p 10307:10307 \
            -e AUTH_GATE_MODE=enforce \
            -e WEBHOOK_ALLOW_QUERY_TOKEN=0 \
            "${{ env.IMAGE_NAME }}:latest"

          ok=0
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:10307/api/login || true)
            if [ "$code" != "000" ]; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "容器未能启动，日志如下："
            docker logs ep-smoke || true
            exit 1
          fi
          echo "service is up (first HTTP code=$code)"

          # 曾被通报「谁来都能进」的接口，现在必须被网关拦下
          for p in /api/history/stats /api/pwa/config /api/auth/settings; do
            c=$(curl -s -o /tmp/body -w '%{http_code}' "http://127.0.0.1:10307$p")
            echo "GET $p -> $c"
            if [ "$c" != "401" ] && [ "$c" != "403" ]; then
              echo "FAIL: 未鉴权接口仍可匿名访问: $p ($c)"
              cat /tmp/body || true
              exit 1
            fi
          done

          # 管理端写接口未登录应被拦截，且不能是 CSRF 403
          c=$(curl -s -o /tmp/body -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://127.0.0.1:10307' \
            -H 'X-Forwarded-Proto: https' \
            -d '{}' http://127.0.0.1:10307/api/manage/user/new)
          echo "POST /api/manage/user/new (anon) -> $c"
          if [ "$c" != "401" ] && [ "$c" != "403" ]; then
            echo "FAIL: 管理接口未登录可访问 ($c)"
            exit 1
          fi
          if grep -q 'Origin 不匹配' /tmp/body; then
            echo "FAIL: 反代下仍触发 CSRF Origin 不匹配"
            exit 1
          fi

          # 2.3：OpenAPI 文档默认仅管理员可访问，匿名读取必须被拦下
          c=$(curl -s -o /tmp/openapi_body -w '%{http_code}' \
            http://127.0.0.1:10307/openapi.json)
          echo "GET /openapi.json (anon) -> $c"
          if [ "$c" != "401" ] && [ "$c" != "403" ]; then
            echo "FAIL: OpenAPI 文档匿名可访问"
            cat /tmp/openapi_body
            exit 1
          fi

          echo "SMOKE PASSED"
          docker logs ep-smoke 2>&1 | tail -30 || true

      # docker push 自动创建的仓库继承 namespace 默认隐私（可能是 Private），
      # GHCR 包首次推送也默认是 Private：两者都会让部署者 docker pull 报 401。
      # 这里在发版流程内自动改为公开，并用匿名拉取硬验证，用户无需任何手动设置。
      - name: 确保 Docker Hub 仓库公开
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_PAT: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          user, pat = os.environ["DH_USER"], os.environ["DH_PAT"]

          def call(url, payload=None, headers=None, method="GET"):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(
                  url, data=data, method=method,
                  headers={"Content-Type": "application/json", **(headers or {})})
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read().decode()
                  return json.loads(raw) if raw.strip() else {}

          token = call("https://hub.docker.com/v2/users/login/",
                       {"username": user, "password": pat}, method="POST")["token"]
          url = "https://hub.docker.com/v2/repositories/%s/embyhub/" % user
          ok_scheme, last = None, None
          for scheme in ("JWT ", "Bearer "):
              try:
                  call(url, {"is_private": False},
                       {"Authorization": scheme + token}, method="PATCH")
                  ok_scheme = scheme
                  print("PATCH ok with", scheme.strip())
                  break
              except urllib.error.HTTPError as e:
                  last = (scheme.strip(), e.code, e.read().decode()[:200])
                  print("PATCH failed:", last)
          if not ok_scheme:
              raise SystemExit("无法设置 Docker Hub 可见性: %r" % (last,))
          info = call(url, headers={"Authorization": ok_scheme + token})
          print("is_private =", info.get("is_private"))
          assert info.get("is_private") is False, "Docker Hub 仓库仍为 private"
          PY

      # GHCR 包通过 OCI org.opencontainers.image.source 关联到 public 仓库，
      # 首次推送即继承 public；GitHub REST 没有可用的 visibility 端点（404），
      # 因此这里只做匿名硬校验，防止以后被误改成 private。
      - name: 校验 GHCR 包可匿名访问
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          name = os.environ["GHCR_IMAGE"].split("/", 1)[1]
          with urllib.request.urlopen(
              "https://ghcr.io/token?scope=repository:%s:pull&service=ghcr.io" % name,
              timeout=30) as r:
              token = json.load(r)["token"]
          req = urllib.request.Request(
              "https://ghcr.io/v2/%s/tags/list" % name,
              headers={"Authorization": "Bearer " + token})
          with urllib.request.urlopen(req, timeout=30) as r:
              tags = json.load(r)["tags"]
          print("GHCR 匿名可见 tags:", tags)
          assert "latest" in tags, "GHCR 包未公开或 latest 缺失"
          PY

      - name: 匿名拉取自检（部署者无需登录）
        run: |
          set -e
          docker logout docker.io >/dev/null 2>&1 || true
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull "${{ env.IMAGE_NAME }}:latest"
          docker pull "${{ env.GHCR_IMAGE }}:latest"

      - name: 清理
        if: always()
        run: docker rm -f ep-smoke || true

  alias:
    name: 补齐双注册表版本别名（仅手动触发）
    if: github.event_name == 'workflow_dispatch' && (inputs.alias_version != '' || inputs.refresh_version != '')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 直接复制已有 manifest，不重新构建；同时把历史 tag 事件只推到
      # Docker Hub 的版本补齐到 GHCR，保证两处版本名一致。
      - name: 从 v 前缀 tag 复制 manifest（双注册表）
        if: inputs.alias_version != '' && inputs.refresh_version == ''
        run: |
          set -e
          V="${{ inputs.alias_version }}"
          SRC="abson2/embyhub:v$V"
          docker buildx imagetools create --tag "abson2/embyhub:$V" "$SRC"
          docker buildx imagetools create --tag "ghcr.io/abson2/embyhub:v$V" "$SRC"
          docker buildx imagetools create --tag "ghcr.io/abson2/embyhub:$V" "$SRC"
          docker buildx imagetools inspect "ghcr.io/abson2/embyhub:$V"

      # 不升版本号的补丁发版：main push / dispatch 的 build job 已把新镜像推到 latest，
      # 这里把 latest 的 manifest 复制到版本 tag，使 docker compose 默认的 2.6 拿到新代码。
      - name: 把本次构建覆盖到版本 tag（双注册表）
        if: inputs.refresh_version != ''
        run: |
          set -e
          V="${{ inputs.refresh_version }}"
          SRC="abson2/embyhub:latest"
          docker buildx imagetools create --tag "abson2/embyhub:$V" "$SRC"
          docker buildx imagetools create --tag "abson2/embyhub:v$V" "$SRC"
          docker buildx imagetools create --tag "ghcr.io/abson2/embyhub:$V" "$SRC"
          docker buildx imagetools create --tag "ghcr.io/abson2/embyhub:v$V" "$SRC"
          docker buildx imagetools inspect "abson2/embyhub:$V"

  release:
    name: 创建 GitHub Release（仅 tag 触发）
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: embyhub ${{ github.ref_name }}
          body_path: CHANGELOG.md
          generate_release_notes: true
